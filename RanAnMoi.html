<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Rắn Ăn Mồi - Snake Classic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 500px;
            width: 100%;
        }

        /* Header & Scores */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Controls Panel */
        .controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        select, button {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            background: #475569;
        }

        /* Canvas Wrap */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
            border: 2px solid #1e293b;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2rem;
            color: #f8fafc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .btn-main {
            background: #2563eb;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            cursor: pointer;
        }

        .btn-main:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* D-Pad Controls for Touch */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            height: 180px;
            margin-top: 5px;
        }

        .dpad-btn {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .dpad-btn:active {
            background: #38bdf8;
            color: #0f172a;
        }

        .dpad-btn.up { grid-column: 2; grid-row: 1; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }

        @media (min-width: 600px) {
            .dpad {
                display: none; /* Hide D-Pad on Desktop */
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <div class="score-box">
                <span class="score-label">Điểm số</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">Kỷ lục</span>
                <span id="high-score" class="score-value">0</span>
            </div>
        </div>

        <!-- Settings -->
        <div class="controls-panel">
            <div class="setting-group">
                <label for="speed-select">Tốc độ:</label>
                <select id="speed-select">
                    <option value="120">Chậm</option>
                    <option value="80" selected>Vừa</option>
                    <option value="50">Nhanh</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="wall-toggle">Xuyên tường:</label>
                <input type="checkbox" id="wall-toggle">
            </div>
            <button id="sound-btn">🔊 Bật</button>
        </div>

        <!-- Canvas Game Wrap -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Start Overlay -->
            <div id="start-screen" class="overlay">
                <h1>RẮN ĂN MỒI</h1>
                <p style="color: #94a3b8; font-size: 0.9rem;">Dùng phím mũi tên hoặc WASD để điều khiển</p>
                <button id="start-btn" class="btn-main">CHƠI NGAY</button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameover-screen" class="overlay hidden">
                <h1 style="color: #ef4444;">GAME OVER</h1>
                <p id="final-score" style="color: #cbd5e1;">Điểm của bạn: 0</p>
                <button id="restart-btn" class="btn-main">CHƠI LẠI</button>
            </div>
        </div>

        <!-- Mobile Touch D-Pad -->
        <div class="dpad">
            <button class="dpad-btn up" id="btn-up">▲</button>
            <button class="dpad-btn left" id="btn-left">◄</button>
            <button class="dpad-btn right" id="btn-right">►</button>
            <button class="dpad-btn down" id="btn-down">▼</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const speedSelect = document.getElementById('speed-select');
        const wallToggle = document.getElementById('wall-toggle');
        const soundBtn = document.getElementById('sound-btn');

        // Game Configuration
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE;
        let dy = 0;
        let nextDx = GRID_SIZE;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameInterval = null;
        let isRunning = false;
        let soundEnabled = true;
        let particles = [];

        highScoreEl.textContent = highScore;

        // Audio System using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Particle System
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x + GRID_SIZE / 2,
                    y: y + GRID_SIZE / 2,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    life: 20
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 1 / p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Game Logic
        function initGame() {
            snake = [
                { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 3 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            nextDx = GRID_SIZE;
            nextDy = 0;
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
            particles = [];
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Handling
            const passWalls = wallToggle.checked;
            if (passWalls) {
                if (head.x < 0) head.x = canvas.width - GRID_SIZE;
                if (head.x >= canvas.width) head.x = 0;
                if (head.y < 0) head.y = canvas.height - GRID_SIZE;
                if (head.y >= canvas.height) head.y = 0;
            } else {
                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    gameOver();
                    return;
                }
            }

            // Self Collision Handling
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }
                playSound('eat');
                createParticles(food.x, food.y, '#f43f5e');
                spawnFood();
            } else {
                snake.pop();
            }

            updateParticles();
        }

        function draw() {
            // Clear Background
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Lines (Subtle)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#f43f5e';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(food.x + GRID_SIZE / 2, food.y + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 8;
                } else {
                    // Body Gradient
                    ctx.fillStyle = '#0284c7';
                    ctx.shadowBlur = 0;
                }

                ctx.fillRect(segment.x + 1, segment.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0;

            // Draw Particles
            drawParticles();
        }

        function startGame() {
            initGame();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            isRunning = true;
            
            if (gameInterval) clearInterval(gameInterval);
            const speed = parseInt(speedSelect.value);
            gameInterval = setInterval(gameLoop, speed);
        }

        function gameOver() {
            playSound('die');
            isRunning = false;
            clearInterval(gameInterval);
            finalScoreEl.textContent = `Điểm của bạn: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        function changeDirection(dir) {
            if (!isRunning) return;
            if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -GRID_SIZE; }
            if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = GRID_SIZE; }
            if (dir === 'LEFT' && dx === 0) { nextDx = -GRID_SIZE; nextDy = 0; }
            if (dir === 'RIGHT' && dx === 0) { nextDx = GRID_SIZE; nextDy = 0; }
        }

        // Input Controls - Keyboard
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    changeDirection('UP'); e.preventDefault(); break;
                case 'ArrowDown': case 's': case 'S':
                    changeDirection('DOWN'); e.preventDefault(); break;
                case 'ArrowLeft': case 'a': case 'A':
                    changeDirection('LEFT'); e.preventDefault(); break;
                case 'ArrowRight': case 'd': case 'D':
                    changeDirection('RIGHT'); e.preventDefault(); break;
            }
        });

        // Input Controls - Mobile Buttons
        document.getElementById('btn-up').addEventListener('click', () => changeDirection('UP'));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection('DOWN'));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection('LEFT'));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection('RIGHT'));

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Bật' : '🔇 Tắt';
        });

        speedSelect.addEventListener('change', () => {
            if (isRunning) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, parseInt(speedSelect.value));
            }
        });

        // Initial Draw
        draw();
    </script>
</body>
</html>
