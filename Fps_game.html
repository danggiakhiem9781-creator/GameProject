<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trận Chiến Phòng Thủ - FPS 2D</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            background-color: #020617;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            cursor: crosshair; /* Đổi con trỏ chuột thành tâm ngắm */
        }
    </style>
</head>
<body>
     <h3><a href="index.html">Quay Trở Lại</a></h3>
    <hr>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Vị trí người chơi (nằm cố định ở tâm màn hình)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            angle: 0,
            hp: 100
        };

        // Quản lý chuột, đạn, kẻ địch và điểm số
        const mouse = { x: 0, y: 0 };
        const bullets = [];
        const enemies = [];
        let score = 0;
        let isGameOver = false;

        // Cập nhật vị trí chuột khi di chuyển
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        // Bắn đạn khi click chuột trái
        canvas.addEventListener("mousedown", (e) => {
            if (isGameOver) {
                // Nếu game over, click chuột để chơi lại
                resetGame();
                return;
            }

            // Tính toán hướng bay của viên đạn từ người chơi đến vị trí chuột
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 7, // Tốc độ đạn X
                vy: Math.sin(angle) * 7, // Tốc độ đạn Y
                radius: 4
            });
        });

        // Hàm tạo kẻ địch ngẫu nhiên từ ngoài rìa màn hình lao vào
        function spawnEnemy() {
            if (isGameOver) return;

            let x, y;
            // Chọn ngẫu nhiên 1 trong 4 cạnh màn hình để xuất hiện
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 : canvas.width;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 : canvas.height;
            }

            const angle = Math.atan2(player.y - y, player.x - x);
            enemies.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * (1.5 + Math.random() * 1.5), // Tốc độ kẻ địch
                vy: Math.sin(angle) * (1.5 + Math.random() * 1.5),
                radius: 12
            });

            // Tự động tạo con tiếp theo sau một khoảng thời gian giảm dần (càng ngày càng nhanh)
            setTimeout(spawnEnemy, Math.max(300, 1000 - score * 5));
        }

        function resetGame() {
            player.hp = 100;
            bullets.length = 0;
            enemies.length = 0;
            score = 0;
            isGameOver = false;
            spawnEnemy();
            update();
        }

        // Vòng lặp cập nhật và vẽ game liên tục
        function update() {
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("BỊ TIÊU DIỆT!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "20px Arial";
                ctx.fillText(`Tổng điểm của bạn: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Bấm chuột vào màn hình để CHƠI LẠI", canvas.width / 2, canvas.height / 2 + 60);
                return;
            }

            // 1. XÓA MÀN HÌNH CŨ
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. XỬ LÝ NGƯỜI CHƠI (Xoay nòng súng theo chuột)
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            
            // Vẽ thân người chơi (Vòng tròn xanh dương)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#38bdf8";
            ctx.fill();
            ctx.closePath();

            // Vẽ nòng súng hướng theo chuột
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, -5, 30, 10);
            ctx.restore();

            // 3. XỬ LÝ ĐẠN
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Vẽ viên đạn màu vàng neon
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#eab308";
                ctx.fill();
                ctx.closePath();

                // Xóa đạn nếu bay ra ngoài màn hình
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // 4. XỬ LÝ KẺ ĐỊCH
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                // Vẽ kẻ địch màu đỏ lao vào
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ef4444";
                ctx.fill();
                ctx.closePath();

                // Kiểm tra va chạm: Đạn bắn trúng Kẻ địch
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const distX = b.x - e.x;
                    const distY = b.y - e.y;
                    const distance = Math.sqrt(distX * distX + distY * distY);

                    if (distance < b.radius + e.radius) {
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        break;
                    }
                }

                // Kiểm tra va chạm: Kẻ địch chạm vào Người chơi
                if (enemies[i]) { // Kiểm tra lại xem kẻ địch còn tồn tại không sau khi check đạn
                    const distToPlayerX = e.x - player.x;
                    const distToPlayerY = e.y - player.y;
                    const distToPlayer = Math.sqrt(distToPlayerX * distToPlayerX + distToPlayerY * distToPlayerY);

                    if (distToPlayer < player.radius + e.radius) {
                        enemies.splice(i, 1);
                        player.hp -= 20; // Trừ 20 máu
                        if (player.hp <= 0) {
                            isGameOver = true;
                        }
                    }
                }
            }

            // 5. VẼ ĐIỂM SỐ VÀ THANH MÁU UI
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "left";
            ctx.fillText(`Điểm: ${score}`, 20, 40);
            ctx.fillText(`Máu: ${player.hp}%`, 20, 70);

            // Thanh máu trực quan màu xanh lá / đỏ
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(20, 80, 150, 10);
            ctx.fillStyle = player.hp > 30 ? "#22c55e" : "#ef4444";
            ctx.fillRect(20, 80, (player.hp / 100) * 150, 10);

            requestAnimationFrame(update);
        }

        // Bắt đầu game lần đầu tiên
        resetGame();
    </script>
</body>
</html>
